# Nginx site for the school web app (static files from `next build`).
# Install: replace __APP_DOMAIN__, copy to /etc/nginx/sites-available/, enable,
# then: sudo certbot --nginx -d __APP_DOMAIN__
server {
    listen 80;
    server_name __APP_DOMAIN__;
    root /var/www/edupulse-school-web/current;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}
